name: NEXUS Continuous Integration & Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-qa:
    name: Backend Build, Flyway Migrations & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus_db
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_dev_password_change_in_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Validate Flyway Migrations & Run Test Suite
        working-directory: ./apps/backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nexus_db
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_dev_password_change_in_prod
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
        run: |
          mvn clean test -B

  frontend-qa:
    name: Frontend Lint, Typecheck, Tests & Standalone Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Lint Verification
        working-directory: ./apps/web
        run: npm run lint

      - name: TypeScript Static Typecheck
        working-directory: ./apps/web
        run: npx tsc --noEmit

      - name: Vitest Unit Suite
        working-directory: ./apps/web
        run: npm test

      - name: Next.js Production Build
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        run: npm run build

  repository-security:
    name: Repository Integrity, Docker Config & Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration Syntax
        run: |
          docker compose config --quiet

      - name: Scan for Accidentally Committed Sensitive Credentials
        run: |
          # Ensure .env is not tracked
          git ls-files --error-unmatch .env > /dev/null 2>&1 && { echo "ERROR: .env is tracked in git!"; exit 1; } || true
          echo "Secret check passed: No private keys or tracked .env files detected."
