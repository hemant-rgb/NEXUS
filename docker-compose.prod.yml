# ==============================================================================
# NEXUS Platform - Production Hardened Compose Configuration
# ==============================================================================

services:
  nexus-postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - nexus-network

  nexus-backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: always
    depends_on:
      nexus-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-nexus_session}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "Lax"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_MODEL: ${AI_MODEL:-nexus-grounded-analyzer-v1}
      AI_API_KEY: ${AI_API_KEY:-}
      RATE_LIMIT_ENABLED: "true"
      ALLOW_PRIVATE_IPS: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - nexus-network

  nexus-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nexus-web
    restart: always
    depends_on:
      nexus-backend:
        condition: service_healthy
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BACKEND_INTERNAL_URL: http://nexus-backend:8080
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - nexus-network

volumes:
  postgres_data:
    name: nexus_postgres_data

networks:
  nexus-network:
    name: nexus-network
    driver: bridge
